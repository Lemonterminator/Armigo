<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 542" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">Armigo 分层 VLA 架构</title>
  <desc id="description">六面质检与分拣 · 视觉—语言—动作策略蒸馏</desc>
  <defs>
    <marker id="online-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#507195"/>
    </marker>
    <marker id="training-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#715caf"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #162840; }
    .meta { font-size: 15px; font-weight: 700; fill: #435773; }
    .title { font-size: 35px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #435773; }
    .section { font-size: 17px; font-weight: 700; fill: #435773; }
    .label { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; fill: #263b55; }
    .small { font-size: 15px; fill: #435773; }
    .note { font-size: 16px; fill: #435773; }
    .link { font-size: 15px; font-weight: 700; fill: #1c528d; }
    .card-link:hover rect, .card-link:focus rect { stroke: #1c528d; stroke-width: 2; }
    .return-link:hover text, .return-link:focus text { text-decoration: underline; }
  </style>
  <rect x="0" y="0" width="1120" height="542" rx="0" fill="#f7f9fc"/>
  <text x="48" y="39" class="meta">ARMIGO / 架构总览</text>
  <text x="48" y="83" class="title">Armigo 分层 VLA 架构</text>
  <text x="48" y="113" class="subtitle">六面质检与分拣 · 视觉—语言—动作策略蒸馏</text>
  <text x="48" y="154" class="section">在线质检与运动控制</text>
  <a href="vla_task_decision.svg" class="card-link" aria-label="任务决策详图">
  <rect x="48" y="169" width="235" height="127" rx="12" fill="#eaf2ff" stroke="#d4dce7"/>
  <text x="66" y="193" class="meta">01 ↗</text>
  <text x="66" y="220" class="label">任务决策</text>
  <text x="66" y="247" class="body">累积多视角证据</text>
  <text x="66" y="271" class="body">调度检测、分拣与恢复</text>
  </a>
  <path d="M287 233 H307" fill="none" stroke="#507195" stroke-width="2" stroke-linejoin="round" marker-end="url(#online-arrow)"/>
  <a href="vla_observations.svg" class="card-link" aria-label="策略观测详图">
  <rect x="311" y="169" width="235" height="127" rx="12" fill="#e5f4f6" stroke="#d4dce7"/>
  <text x="329" y="193" class="meta">02 ↗</text>
  <text x="329" y="220" class="label">策略观测</text>
  <text x="329" y="247" class="body">编码图像、机器人状态</text>
  <text x="329" y="271" class="body">与运动片段条件</text>
  </a>
  <path d="M550 233 H570" fill="none" stroke="#507195" stroke-width="2" stroke-linejoin="round" marker-end="url(#online-arrow)"/>
  <a href="vla_policy_models.svg" class="card-link" aria-label="动作策略详图">
  <rect x="574" y="169" width="235" height="127" rx="12" fill="#f0edfd" stroke="#d4dce7"/>
  <text x="592" y="193" class="meta">03 ↗</text>
  <text x="592" y="220" class="label">动作策略</text>
  <text x="592" y="247" class="body">生成关节动作序列</text>
  <text x="592" y="271" class="body">并预测片段终止步</text>
  </a>
  <path d="M813 233 H833" fill="none" stroke="#507195" stroke-width="2" stroke-linejoin="round" marker-end="url(#online-arrow)"/>
  <a href="vla_segment_execution.svg" class="card-link" aria-label="片段执行详图">
  <rect x="837" y="169" width="235" height="127" rx="12" fill="#e7f4ed" stroke="#d4dce7"/>
  <text x="855" y="193" class="meta">04 ↗</text>
  <text x="855" y="220" class="label">片段执行</text>
  <text x="855" y="247" class="body">以 30 Hz 执行关节目标</text>
  <text x="855" y="271" class="body">并回报终止与异常</text>
  </a>
  <path d="M954 298 V327 H165 V300" fill="none" stroke="#507195" stroke-width="2" stroke-linejoin="round" marker-end="url(#online-arrow)"/>
  <rect x="395" y="314" width="330" height="26" rx="0" fill="#f7f9fc"/>
  <text x="560" y="332" class="small" text-anchor="middle">片段终止或异常反馈 · 触发下一次任务决策</text>
  <text x="48" y="378" class="section">离线策略训练与迭代</text>
  <text x="1072" y="378" class="small" text-anchor="end">训练产出策略权重，供在线动作策略加载</text>
  <a href="vla_imitation_training.svg" class="card-link" aria-label="离线模仿训练详图">
  <rect x="48" y="393" width="448" height="100" rx="12" fill="#f0edfd" stroke="#d4dce7"/>
  <text x="66" y="417" class="meta">05 ↗</text>
  <text x="66" y="444" class="label">离线模仿训练</text>
  <text x="66" y="471" class="body">用专家示范训练初始动作策略</text>
  </a>
  <a href="vla_expert_takeover.svg" class="card-link" aria-label="专家接管与数据聚合详图">
  <rect x="624" y="393" width="448" height="100" rx="12" fill="#fbf0df" stroke="#d4dce7"/>
  <text x="642" y="417" class="meta">06 ↗</text>
  <text x="642" y="444" class="label">专家接管与数据聚合</text>
  <text x="642" y="471" class="body">从闭环偏差中采集恢复示范，迭代微调策略</text>
  </a>
  <path d="M500 443 H620" fill="none" stroke="#715caf" stroke-width="2" stroke-linejoin="round" marker-end="url(#training-arrow)"/>
  <text x="560" y="431" class="small" text-anchor="middle">初始策略</text>
  <text x="48" y="522" class="small">设计蓝图 · 点击模块查看详图</text>
</svg>
