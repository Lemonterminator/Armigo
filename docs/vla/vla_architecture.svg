<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1070" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#555"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#2471a3"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#7d3c98"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0L10,5L0,10z" fill="#c0392b"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #555; stroke-width: 1.2; }
      .t { font-weight: 600; font-size: 13px; fill: #1f2937; }
      .h { font-weight: 700; font-size: 14px; }
      .s { font-size: 11px; fill: #374151; }
      .m { font-size: 10.5px; fill: #4b5563; }
      .e { stroke: #555; stroke-width: 1.4; fill: none; marker-end: url(#a); }
      .eb { stroke: #2471a3; stroke-width: 1.4; fill: none; marker-end: url(#b); }
      .ep { stroke: #7d3c98; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#p); }
      .er { stroke: #c0392b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#r); }
      .ers { stroke: #c0392b; stroke-width: 1.4; fill: none; marker-end: url(#r); }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1440" height="1070" fill="#fafafa"/>

  <!-- 标题区 -->
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">Armigo 分层 VLA 蒸馏与闭环纠偏架构（R3 · D1 · SmolVLA / ACT · S11 HG-DAgger）</text>
  <text x="24" y="52" class="s">实线：在线推理、控制与片段交互流；紫色虚线：离线流匹配训练与梯度流；红色虚线：S11 Takeover HG-DAgger 接管恢复与迭代微调流。</text>

  <!-- ======================================================================= -->
  <!-- BAND 1: R3 分层决策与执行分离 (y = 72..282)                              -->
  <!-- ======================================================================= -->

  <!-- 左面板：高层 C 决策 -->
  <rect x="24" y="72" width="645" height="210" rx="8" fill="#eef5ff" stroke="#2471a3" stroke-width="1.5"/>
  <text x="40" y="95" class="h" fill="#1a5276">1A. 高层决策层 · Segment-Level C（LangGraph + sup-v7bot + Realistic 感知）</text>

  <rect x="40" y="108" width="300" height="160" rx="6" class="box"/>
  <text x="52" y="127" class="t" fill="#1a5276">LangGraph 图与感知（twin_graph.py）</text>
  <text x="52" y="146" class="s">• 节点流：prepare → choose_view ↔ scan_wrist</text>
  <text x="52" y="162" class="s">  / present_bottom → recover / place → evaluate</text>
  <text x="52" y="180" class="s">• sup-v7bot 检测器：局部裁剪图打分，早停判别</text>
  <text x="52" y="198" class="s">• Realistic 感知：噪声 D415 测砖 pose 与 2×2/2×4，</text>
  <text x="52" y="214" class="s">  颜色+3D 缘拟合找碗（S1 已移除真实碗碰撞泄露）</text>
  <text x="52" y="232" class="s">• 仅做 C 级全局决策：选视角、判好坏、决定恢复</text>
  <text x="52" y="250" class="m" fill="#1a5276">原则 R3：跨分钟的证据累积与早停保留在高层</text>

  <rect x="352" y="108" width="301" height="160" rx="6" class="box"/>
  <text x="364" y="127" class="t" fill="#1a5276">Controller 边界接口（StudentTwin）</text>
  <text x="364" y="146" class="s">• _execute() 拦截技能生成器，拆分为 Segment</text>
  <text x="364" y="162" class="s">• policy_inputs() 仅暴露 POLICY_FIELDS：</text>
  <text x="364" y="178" class="s">  kind, instruction, view, views, bowl</text>
  <text x="364" y="196" class="s">• 严禁向学生泄露 target_q / faces 等诊断参数</text>
  <text x="364" y="214" class="s">• 片段边界触发：_capture()、夹持验证 _clamped、</text>
  <text x="364" y="230" class="s">  在手变换 _grip_from_brick、lost 掉砖监控</text>
  <text x="364" y="250" class="m" fill="#1a5276">所有 C 级信号留在控制器，不进入学生输入与损失</text>

  <!-- 中间交互箭头 -->
  <path d="M669,145 L769,145" class="eb"/>
  <text x="720" y="130" text-anchor="middle" class="s" fill="#1a5276" font-weight="600">Segment 指令</text>
  <text x="720" y="162" text-anchor="middle" class="m">policy_inputs</text>

  <path d="M771,220 L671,220" class="e"/>
  <text x="720" y="207" text-anchor="middle" class="s" font-weight="600">segment_done</text>
  <text x="720" y="236" text-anchor="middle" class="m">end_step 触发</text>

  <!-- 右面板：底层 M 执行与 12 类 SEGMENT_KINDS -->
  <rect x="771" y="72" width="645" height="210" rx="8" fill="#eefaf6" stroke="#148f77" stroke-width="1.5"/>
  <text x="787" y="95" class="h" fill="#0e6655">1B. 底层运动层 · Motion-Level M（12 类 Segment-Conditioned VLA 学生）</text>
  <text x="787" y="113" class="s">学生仅在单片段内以 30 Hz 输出 6-DoF 关节弧度目标（经相同命令滤波器），动作标签绝不依赖未来决策：</text>

  <rect x="787" y="124" width="198" height="144" rx="6" class="box"/>
  <text x="797" y="142" class="t" fill="#0e6655">无持砖阶段 (held=False)</text>
  <text x="797" y="164" class="s">1. prepare (600f)</text>
  <text x="797" y="182" class="m">   初始休眠并移至 ready</text>
  <text x="797" y="202" class="s">2. scan_view (900f)</text>
  <text x="797" y="220" class="m">   移至第 k/n 腕部视角并悬停</text>
  <text x="797" y="240" class="s">3. return_ready (600f)</text>
  <text x="797" y="258" class="s">4. grasp (1500f) 闭合夹持</text>

  <rect x="995" y="124" width="204" height="144" rx="6" class="box"/>
  <text x="1005" y="142" class="t" fill="#0e6655">持砖阶段 (held=True)</text>
  <text x="1005" y="164" class="s">5. lift (600f) 垂直提起</text>
  <text x="1005" y="186" class="s">6. present_bottom (900f)</text>
  <text x="1005" y="204" class="m">   向顶视展示底面并悬停</text>
  <text x="1005" y="224" class="s">7. return_to_lift (600f)</text>
  <text x="1005" y="246" class="s">8. lower_on_table (1200f)</text>
  <text x="1005" y="262" class="m">   （上述均开启掉砖监控）</text>

  <rect x="1209" y="124" width="191" height="144" rx="6" class="box"/>
  <text x="1219" y="142" class="t" fill="#0e6655">放置与恢复阶段</text>
  <text x="1219" y="164" class="s">9. carry_to_bowl (1200f)</text>
  <text x="1219" y="182" class="m">   held=True · 移至目标碗</text>
  <text x="1219" y="202" class="s">10. release_on_table (600f)</text>
  <text x="1219" y="222" class="s">11. release_in_bowl (900f)</text>
  <text x="1219" y="242" class="s">12. let_go (300f)</text>
  <text x="1219" y="260" class="m">    原地松开（_retry 恢复）</text>

  <!-- ======================================================================= -->
  <!-- BAND 2: D1 输入与双学生模型对比 (y = 312..632)                           -->
  <!-- ======================================================================= -->

  <!-- D1 输入列 -->
  <rect x="24" y="312" width="360" height="320" rx="8" fill="#fff8e8" stroke="#d68910" stroke-width="1.5"/>
  <text x="40" y="335" class="h" fill="#9c640c">2A. D1 学生多模态输入（当前帧）</text>

  <rect x="40" y="348" width="328" height="92" rx="6" class="box"/>
  <text x="52" y="366" class="t" fill="#9c640c">3 路图像观测（512×512）</text>
  <text x="52" y="384" class="s">• top_rgb_v2：固定顶视裁剪 RGB</text>
  <text x="52" y="400" class="s">• top_depth_v2：模拟噪声 D415 高度图（3ch）</text>
  <text x="52" y="416" class="s">• wrist：腕部相机 RGB（近距检测与对准）</text>
  <text x="52" y="432" class="m">注：Pilot 不含 front 相机与 gripper effort</text>

  <rect x="40" y="448" width="328" height="122" rx="6" class="box"/>
  <text x="52" y="466" class="t" fill="#9c640c">36 维状态 + 历史 + 结构化条件（弧度）</text>
  <text x="52" y="485" class="s">• 状态与历史 [19d]：q_t (6) + q_{t-1} (6)</text>
  <text x="52" y="501" class="s">  + a_{t-1} (6) + gripper_cmd (1)</text>
  <text x="52" y="520" class="s">• 结构化条件 [17d]：12-kind one-hot (12)</text>
  <text x="52" y="536" class="s">  + 3-bowl one-hot (3) + view_norm (1)</text>
  <text x="52" y="552" class="s">  + segment_frame_norm (1)</text>
  <text x="52" y="565" class="m">实机教训：place-v1-smolvla-e40 曾忽略文本碗名</text>

  <rect x="40" y="578" width="328" height="42" rx="6" class="box"/>
  <text x="52" y="596" class="t" fill="#9c640c">文本指令：Segment.instruction</text>
  <text x="52" y="612" class="m">由 policy_inputs() 传入，与训练期 task 完全一致</text>

  <!-- 主学生：SmolVLA 列 -->
  <rect x="414" y="312" width="510" height="320" rx="8" fill="#f5f0fb" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="430" y="335" class="h" fill="#5b2c6f">2B. 主学生：SmolVLA (~450M) + End-Step Head</text>

  <rect x="430" y="348" width="478" height="90" rx="6" class="box"/>
  <text x="442" y="366" class="t" fill="#5b2c6f">SmolVLM2-500M 多模态前缀骨干</text>
  <text x="442" y="384" class="s">• 冻结 SigLIP 视觉编码器：每路相机输出 64 个视觉 token（3 路共 192）</text>
  <text x="442" y="400" class="s">• 36 维向量投影为 1 个 state token；与文本指令 token 拼接构成 Prefix</text>
  <text x="442" y="416" class="s">• SmolLM2 跳过上半部分 Transformer 层，加速前向并保留跨模态特征</text>
  <text x="442" y="431" class="m">可训练参数聚焦：Action Expert + State Proj + End-Step Head（lr = 1e-4）</text>

  <rect x="430" y="446" width="234" height="118" rx="6" class="box"/>
  <text x="440" y="465" class="t" fill="#5b2c6f">Flow-Matching Action Expert</text>
  <text x="440" y="484" class="s">• ~100M 参数动作专家网络</text>
  <text x="440" y="500" class="s">• 交替层：Prefix 交叉注意力</text>
  <text x="440" y="516" class="s">  + 动作序列内部自注意力</text>
  <text x="440" y="534" class="s">• 输出未来 H = 50 步 (1.67 s)</text>
  <text x="440" y="552" class="m">10 步 Euler 积分 · 延迟 85–150 ms</text>

  <rect x="674" y="446" width="234" height="118" rx="6" class="box"/>
  <text x="684" y="465" class="t" fill="#5b2c6f">End-Step MLP Head (H+2 类)</text>
  <text x="684" y="484" class="s">• 池化前缀特征 → MLP 分类</text>
  <text x="684" y="500" class="s">• 类 0..H：预测在第 k 步结束</text>
  <text x="684" y="516" class="s">  （类 0 覆盖零帧片段 let_go）</text>
  <text x="684" y="534" class="s">• 类 H+1：超出本 chunk 范围</text>
  <text x="684" y="552" class="m">零等待即时停段，避开 100ms 延迟</text>

  <rect x="430" y="572" width="478" height="48" rx="6" fill="#fbf7ff" stroke="#7d3c98" stroke-width="1"/>
  <text x="442" y="591" class="s" font-weight="600" fill="#5b2c6f">输出：A ∈ R^{50×6}（训练集均值/方差归一化弧度目标）+ end_step ∈ {0..51}</text>
  <text x="442" y="608" class="m">部署：CUDA Policy Server 推理，twin 客户端通过异步队列执行</text>

  <!-- 基线：ACT 列 -->
  <rect x="954" y="312" width="462" height="320" rx="8" fill="#f3f9f1" stroke="#3c8d40" stroke-width="1.5"/>
  <text x="970" y="335" class="h" fill="#2d6a30">2C. 基线学生：ACT (~10 ms/步 · S12 消融对照)</text>

  <rect x="970" y="348" width="430" height="90" rx="6" class="box"/>
  <text x="982" y="366" class="t" fill="#2d6a30">ResNet18 编码 + CVAE Encoder</text>
  <text x="982" y="384" class="s">• 3 路相机各配独立 ResNet18 提取空间特征图 + 36d 条件投影</text>
  <text x="982" y="400" class="s">• 训练期 CVAE Encoder q_φ(z | a_{t:t+H}, s_t) 编码轨迹多模态风格 z</text>
  <text x="982" y="416" class="s">• 推理期先验置 z = 0（确定性解码），消除多峰均值模糊</text>
  <text x="982" y="431" class="m">仅基于小容量视觉编码器，无预训练 VLM 语言与视觉先验</text>

  <rect x="970" y="446" width="430" height="118" rx="6" class="box"/>
  <text x="982" y="465" class="t" fill="#2d6a30">CVAE Transformer Decoder + End-Step Head</text>
  <text x="982" y="484" class="s">• Transformer Decoder 一次性并行输出 H = 100 步动作块（3.33 s）</text>
  <text x="982" y="502" class="s">• 损失：Masked L1 重建 + 10·KL(q_φ(z|·) ‖ N(0, I)) + λ·L_done</text>
  <text x="982" y="520" class="s">• 共享同样的 End-Step MLP Head（H+2 类：0..100, 101）</text>
  <text x="982" y="538" class="s">• 单步推理仅 ~10 ms（无需异步队列），同样在片段切换时清空缓存队列</text>
  <text x="982" y="554" class="m">S12 用途：等预算对比 SmolVLA，量化预训练 VLM 骨干带来的泛化增益</text>

  <rect x="970" y="572" width="430" height="48" rx="6" fill="#edf7ec" stroke="#3c8d40" stroke-width="1"/>
  <text x="982" y="591" class="s" font-weight="600" fill="#2d6a30">关键差异：不依赖跨段 Temporal Ensembling（跨片段均值会破坏边界）</text>
  <text x="982" y="608" class="m">输出：A ∈ R^{100×6} + end_step ∈ {0..101}</text>

  <!-- D1 -> SmolVLA & ACT 箭头 -->
  <path d="M384,472 L412,472" class="e"/>
  <path d="M204,312 L204,300 L1185,300 L1185,310" class="e"/>
  <text x="720" y="295" text-anchor="middle" class="m" fill="#9c640c">同样 D1 观测 + 36d 条件送入 ACT 基线</text>

  <!-- ======================================================================= -->
  <!-- BAND 3: Masked Flow Matching 与 S11 HG-DAgger (y = 658..1048)           -->
  <!-- ======================================================================= -->

  <!-- Band 2 -> Band 3 连接箭头 -->
  <path d="M620,632 L620,656" class="ep"/>
  <path d="M460,632 L460,656" class="e"/>

  <!-- 左下：Masked Flow Matching & Segment Execution -->
  <rect x="24" y="658" width="680" height="390" rx="8" fill="#eef7fb" stroke="#2471a3" stroke-width="1.5"/>
  <text x="40" y="682" class="h" fill="#1a5276">3. 掩码流匹配训练与异步片段执行（S7 边界对齐 · S9 损失 · S10 闭环）</text>

  <rect x="40" y="696" width="648" height="122" rx="6" class="box"/>
  <text x="52" y="715" class="t" fill="#1a5276">Masked Flow Matching 与“末帧有效动作”填充（S7 + S9）</text>
  <text x="52" y="734" class="s">• 流匹配插值：A_τ = τ·ε + (1 - τ)·A，τ ∈ (0, 1)，ε ~ N(0, I)，目标速度场 u = ε - A</text>
  <text x="52" y="752" class="s">• 掩码定义 m_k = 1 iff (k &lt; chunk_valid_len) ∧ (非盲帧 S5) ∧ (未越过接管点 S11)</text>
  <text x="52" y="770" class="s">• 总损失：L = L_act + λ·L_done (λ≈0.1)，其中 L_act = Σ m_k ‖v_θ(A_τ, o, c, τ)_k - u_k‖² / Σ m_k</text>
  <text x="52" y="788" class="s">• 填充规范：m_k = 0 的越界步必须用“当前片段最后一个有效动作”填充，绝不用下一片段动作</text>
  <text x="52" y="806" class="m">（LeRobot 默认仅在 episode 末尾填充 is_pad；若不加片段掩码，30–60 步 chunk 会跨过片段边界发生信息泄露）</text>

  <rect x="40" y="828" width="648" height="100" rx="6" class="box"/>
  <text x="52" y="847" class="t" fill="#c0392b">避坑 SEGMENT_DONE_CONVENTION（为什么不用逐帧 done 头）</text>
  <text x="52" y="866" class="s">• 导出约定：segment.done = True 记在行 r（上一片段结束观测 = 下一片段首观测），行 r 的 task 已是新片段指令</text>
  <text x="52" y="884" class="s">• 陷阱：若直接按 (obs_r, task_r) 训练逐帧“是否完成”，模型会学成“新片段刚开始第 0 帧就立刻结束”</text>
  <text x="52" y="902" class="s">• 解法：End-Step Head 用行 r 所属片段的 chunk_valid_len 作监督（若 ≤ H 且 reason='done' 取之，否则 H+1）；</text>
  <text x="52" y="918" class="m">  零帧片段（如 let_go）单独补一条 (obs_r, 旧片段条件) → end_step = 0 训练样本</text>

  <rect x="40" y="938" width="648" height="96" rx="6" fill="#eefaf6" stroke="#148f77" stroke-width="1.2"/>
  <text x="52" y="957" class="t" fill="#0e6655">异步 50 步 Chunk 执行与片段切换清零（S10 闭环推理）</text>
  <text x="52" y="976" class="s">• 异步队列：SmolVLA 单次推理 85–150 ms（约 3–5 帧），后台推理新 chunk，前台按 30 Hz 消费队列动作</text>
  <text x="52" y="994" class="s">• 准时停段：执行到预测的 end_step 时立即返回 segment_done，无需等待下一次大模型前向完成</text>
  <text x="52" y="1012" class="s">• 队列清零：一旦 Controller 切换到新片段指令，立即丢弃队列中所有残留动作，杜绝跨片段动作惯性</text>

  <!-- 左下 -> 右下闭环交接箭头 -->
  <path d="M704,750 L734,750" class="ers"/>

  <!-- 右下：S11 Takeover HG-DAgger -->
  <rect x="736" y="658" width="680" height="390" rx="8" fill="#fdf0ef" stroke="#c0392b" stroke-width="1.5"/>
  <text x="752" y="682" class="h" fill="#962d22">4. S11 Takeover HG-DAgger 迭代纠偏闭环（仅限训练布局）</text>

  <!-- Step 1 -->
  <rect x="752" y="696" width="196" height="114" rx="6" class="box"/>
  <text x="762" y="715" class="t" fill="#962d22">① 闭环 Rollout</text>
  <text x="762" y="734" class="s">• Controller + 当前学生</text>
  <text x="762" y="750" class="s">• 仅在 train 布局集上运行</text>
  <text x="762" y="768" class="s">• val 集仅用于早停评估</text>
  <text x="762" y="786" class="s">• sealed test 全程隔离</text>
  <text x="762" y="802" class="m">收集分布偏移真实失败状态</text>

  <path d="M948,753 L972,753" class="ers"/>

  <!-- Step 2 -->
  <rect x="974" y="696" width="212" height="114" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
  <text x="984" y="715" class="t" fill="#962d22">② Realistic 接管门控</text>
  <text x="984" y="734" class="s">全由 realistic 传感器触发：</text>
  <text x="984" y="752" class="s">• 学生关节偏离同状态专家</text>
  <text x="984" y="768" class="s">  规划 &gt; 阈值</text>
  <text x="984" y="784" class="s">• 夹爪 BLOCKED / brick_lost</text>
  <text x="984" y="800" class="s">• 片段超时或运动停滞</text>

  <path d="M1186,753 L1210,753" class="ers"/>

  <!-- Step 3 -->
  <rect x="1212" y="696" width="188" height="114" rx="6" class="box"/>
  <text x="1222" y="715" class="t" fill="#962d22">③ 就地恢复轨迹</text>
  <text x="1222" y="734" class="s">• 专家从当前物理状态重规划</text>
  <text x="1222" y="750" class="s">• 原位恢复并完成剩余任务</text>
  <text x="1222" y="768" class="s">• retries +1（绝不回滚物理）</text>
  <text x="1222" y="786" class="s">• 复用 S7 规则标注片段信息</text>
  <text x="1222" y="802" class="m">产生可见因果的恢复示范</text>

  <!-- Step 3 -> Step 4 向下箭头（③ -> ④ -> ⑤） -->
  <path d="M1306,810 L1306,824 L909,824 L909,836" class="ers"/>

  <!-- Step 4 -->
  <rect x="752" y="838" width="314" height="112" rx="6" class="box"/>
  <text x="762" y="857" class="t" fill="#962d22">④ 接管帧标注规则（严禁回填与跨界）</text>
  <text x="762" y="876" class="s">• 仅标注接管帧及之后的专家控制帧</text>
  <text x="762" y="894" class="s">• 绝不向接管前的学生帧回填专家动作</text>
  <text x="762" y="912" class="s">• 学生帧的 chunk 在接管点截断（S7 掩码）</text>
  <text x="762" y="930" class="s">• 偏离至触发间的盲帧置掩码（不计入 L_act）</text>

  <path d="M1066,894 L1088,894" class="ers"/>

  <!-- Step 5 -->
  <rect x="1090" y="838" width="310" height="112" rx="6" class="box"/>
  <text x="1100" y="857" class="t" fill="#962d22">⑤ 2× 加权聚合微调与早停</text>
  <text x="1100" y="876" class="s">• 经 S6 Grader 质检后：D ← D ∪ D_takeover</text>
  <text x="1100" y="894" class="s">• 从上一轮 Checkpoint 在并集上微调</text>
  <text x="1100" y="912" class="s">• 接管恢复样本权重上调（初始 2×）</text>
  <text x="1100" y="930" class="s">• 门控：连续 2 轮 val 提升 &lt; 2 pts 即停</text>

  <!-- ⑤ 微调反馈回 SmolVLA（沿右侧边缘上行，走 y=650 空走廊，零交叉） -->
  <path d="M1400,894 L1408,894 L1408,650 L669,650 L669,634" class="er"/>
  <text x="1035" y="645" text-anchor="middle" class="m" fill="#962d22">聚合 D ∪ D_takeover（2× 权重）→ 下一轮微调 SmolVLA</text>

  <!-- 底部理论说明框 -->
  <rect x="752" y="960" width="648" height="74" rx="6" fill="#fff8e8" stroke="#d68910" stroke-width="1.2"/>
  <text x="764" y="979" class="t" fill="#9c640c">为何采用 Takeover HG-DAgger 而非经典 Ross et al. (2011) DAgger？</text>
  <text x="764" y="998" class="s">• 经典 DAgger 假设专家是无状态单步 Oracle π*(s)，可对学生走到的每个孤立状态立即查询最优单步动作；</text>
  <text x="764" y="1016" class="s">• Realistic 专家是带伺服积分器与内部信念的轨迹规划器，只能从当前状态接管并生成连续恢复轨迹，故仅标注其实际接管段。</text>
</svg>
