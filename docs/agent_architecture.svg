<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#555"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker>
    <style>
      .box{fill:#fff;stroke:#555;stroke-width:1.2}
      .t{font-weight:600}
      .s{font-size:11px;fill:#444}
      .e{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .both{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a);marker-start:url(#a)}
      .d{stroke:#c0392b;stroke-width:1.3;fill:none;stroke-dasharray:5 3;marker-end:url(#r)}
      .todo{font-size:11px;fill:#c46a00}
    </style>
  </defs>
  <rect width="1180" height="840" fill="#fafafa"/>
  <text x="20" y="30" font-size="18" font-weight="700">Armigo 智能体架构（合并后，agent-overhaul 分支，2026-11-18）</text>
  <text x="20" y="50" class="s">实线是调用和数据流。红色虚线是 LLM 调用，只在传了 --llm-url 时才走。橙色字是还没解决的问题。</text>

  <!-- ===== 左列 ===== -->
  <rect x="20" y="70" width="280" height="90" rx="6" class="box" style="fill:#eef5ff"/>
  <text x="35" y="93" class="t">MCP 客户端</text>
  <text x="35" y="112" class="s">Claude 或任意 MCP 客户端</text>
  <text x="35" y="128" class="s">走 stdio 或 streamable HTTP</text>
  <text x="35" y="144" class="s">wait_job 期间会收到进度通知</text>

  <rect x="20" y="290" width="280" height="300" rx="8" fill="#f5f0fb" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="35" y="312" class="t" fill="#5b2c6f">外层策略搜索 · twin_search.py</text>
  <text x="35" y="334" class="s">54 种策略全部参与，按 successive</text>
  <text x="35" y="350" class="s">halving 逐轮淘汰</text>
  <text x="35" y="370" class="s">同一轮的策略跑同一批样例，</text>
  <text x="35" y="386" class="s">默认策略一直留到最后一轮</text>
  <text x="35" y="406" class="s">最后的胜者要在新样例上赢过默认：</text>
  <text x="35" y="422" class="s">成功率做符号检验，帧数看</text>
  <text x="35" y="438" class="s">bootstrap 区间。不显著就留默认</text>
  <text x="35" y="458" class="s">budget 1–8，最多跑</text>
  <text x="35" y="474" class="s">50×(budget+1) 个 episode</text>
  <text x="35" y="494" class="s">episode 通过 run_batch 交给工作池</text>
  <text x="35" y="514" class="s">Qwen 只写一份失败分析，不参与</text>
  <text x="35" y="530" class="s">选择（用的是右边同一个 LLM 客户端）</text>
  <text x="35" y="556" class="todo">budget 小的时候检验力不够，</text>
  <text x="35" y="572" class="todo">多半会保留默认策略</text>

  <rect x="20" y="670" width="280" height="140" rx="6" class="box" style="fill:#f1f1f1;stroke:#999;stroke-dasharray:4 3"/>
  <text x="35" y="692" class="t" fill="#666">已归档</text>
  <text x="35" y="712" class="s">archive/stage3_pose_graph/</text>
  <text x="35" y="732" class="s">旧的 Stage-3 位姿菜单图</text>
  <text x="35" y="748" class="s">（interrupt/resume 驱动专家）</text>
  <text x="35" y="768" class="s">它"校验后带错误重问一次"的</text>
  <text x="35" y="784" class="s">做法已并入 select_skill</text>
  <text x="35" y="800" class="s">默认测试不再收集它</text>

  <!-- ===== 中列 ===== -->
  <rect x="330" y="70" width="520" height="190" rx="8" fill="#f3f9f1" stroke="#3c8d40" stroke-width="1.5"/>
  <text x="345" y="92" class="t" fill="#2d6a30">armigo-mcp 服务 · FastMCP · twin_mcp.py</text>
  <rect x="345" y="102" width="240" height="118" rx="6" class="box"/>
  <text x="357" y="121" class="t">8 个工具</text>
  <text x="357" y="140" class="s">list_cases · get_observation</text>
  <text x="357" y="156" class="s">start_episode</text>
  <text x="357" y="172" class="s">start_policy_search</text>
  <text x="357" y="188" class="s">job_status · wait_job</text>
  <text x="357" y="204" class="s">cancel_job · resume_job</text>
  <rect x="597" y="102" width="240" height="118" rx="6" class="box"/>
  <text x="609" y="121" class="t">TwinService + JobStore</text>
  <text x="609" y="140" class="s">jobs.sqlite 存任务、进度和结果</text>
  <text x="609" y="156" class="s">request_id 幂等，重启后照样有效</text>
  <text x="609" y="172" class="s">重启时没跑完的任务记为 interrupted</text>
  <text x="609" y="188" class="s">内层图状态存在 graph.sqlite</text>
  <text x="609" y="204" class="s">resume 从磁盘上的检查点接着跑</text>
  <text x="345" y="244" class="todo">worker 进程被强杀时，上面的任务只能记为失败，不能续跑</text>

  <rect x="330" y="290" width="520" height="84" rx="8" fill="#fff" stroke="#2471a3" stroke-width="1.2"/>
  <text x="345" y="311" class="t" fill="#1a5276">Episode 工作池 · twin_pool.py（--workers N）</text>
  <text x="345" y="330" class="s">多进程 spawn。父进程只开 1 个 v6 检测器（约 590 MiB 显存），worker 用队列送裁剪图</text>
  <text x="345" y="347" class="s">取消请求和进度都经过 jobs.sqlite，线程模式和进程模式行为相同</text>
  <text x="345" y="364" class="s">bench16 上 8 个 worker 快 3.5 倍，每个样例的结果和单 worker 一致</text>

  <rect x="330" y="394" width="520" height="246" rx="8" fill="#eef7fb" stroke="#2471a3" stroke-width="1.5"/>
  <text x="345" y="414" class="t" fill="#1a5276">内层图 · twin_graph.py（每个 episode 调一次）</text>
  <rect x="350" y="434" width="100" height="34" rx="5" class="box"/><text x="372" y="456" class="t">prepare</text>
  <rect x="500" y="434" width="130" height="34" rx="5" class="box" style="fill:#fff3cd"/><text x="522" y="456" class="t">choose_view</text>
  <rect x="700" y="418" width="125" height="28" rx="5" class="box"/><text x="722" y="437" class="t">scan_wrist</text>
  <rect x="700" y="456" width="125" height="28" rx="5" class="box"/><text x="707" y="475" class="t">present_bottom</text>
  <rect x="350" y="500" width="100" height="34" rx="5" class="box" style="fill:#fff3cd"/><text x="374" y="522" class="t">recover</text>
  <rect x="500" y="500" width="130" height="34" rx="5" class="box"/><text x="547" y="522" class="t">place</text>
  <rect x="700" y="500" width="125" height="34" rx="5" class="box"/><text x="733" y="522" class="t">evaluate</text>
  <path d="M450,451 L498,451" class="e"/>
  <path d="M632,444 L698,433" class="both"/>
  <path d="M632,460 L698,470" class="both"/>
  <path d="M565,468 L565,498" class="e"/>
  <path d="M630,517 L698,517" class="e"/>
  <path d="M450,505 L512,470" class="e"/>
  <path d="M400,534 L400,552 L762,552 L762,536" class="e"/>
  <text x="345" y="574" class="s">技能出错都会进 recover（这几条边没画）。黄色节点可以问 LLM，但只能从给定选项里挑。</text>
  <text x="345" y="592" class="s">上下文只放覆盖到的面、分数、失败码和剩余预算，第一次决策约 200 tokens（原来 1,643）。</text>
  <text x="345" y="610" class="s">答案不合法就带着错误重问一次，还不行就用第一个选项，并记下回退原因。</text>
  <text x="345" y="628" class="s">decision()：任一视角超过阈值判 defective；六个面都有负证据才判 normal，否则 unknown。</text>

  <rect x="330" y="670" width="520" height="140" rx="8" fill="#f4f4f4" stroke="#777"/>
  <text x="345" y="692" class="t">TwinMujoco 后端 · twin_mujoco.py</text>
  <text x="345" y="712" class="s">真实摩擦抓取，动作好坏由审计过的评估器判定</text>
  <text x="345" y="728" class="s">砖在桌上、夹爪张开时存检查点，同时写到磁盘</text>
  <text x="345" y="744" class="s">rewind 可选"检查点"或"检查点+变体"。变体共 5 种（如 slow_scan），都有上下限</text>
  <text x="345" y="760" class="s">默认回到力矩卡住之前的那个检查点。restore_state 由 rewind 和 resume 共用</text>
  <text x="345" y="776" class="s">dev4 规则模式 2/4 → 4/4，bench16 12/16 → 14/16，没出问题的 episode 帧数完全不变</text>
  <text x="345" y="798" class="todo">健康检查要等放置之后才跑，扫描时卡住要多跑约 1,500 帧才会被发现</text>

  <!-- ===== 右列 ===== -->
  <rect x="880" y="70" width="280" height="165" rx="8" fill="#fdf0ef" stroke="#c0392b" stroke-width="1.5"/>
  <text x="895" y="92" class="t" fill="#962d22">vLLM（WSL）</text>
  <text x="895" y="112" class="s">serve_armigo_qwen.sh，端口 8038</text>
  <text x="895" y="128" class="s">Qwen3.8-27B-NVFP4，上下文 4096</text>
  <text x="895" y="144" class="s">默认 4 路并发，开 prefix cache</text>
  <text x="895" y="160" class="s">还是 eager 模式（省显存）</text>
  <text x="895" y="176" class="s">参数都能用环境变量覆盖</text>
  <text x="895" y="196" class="s">KV nvfp4，每次请求最多 1 张图</text>
  <text x="895" y="220" class="todo">没有守护进程，也没有健康检查</text>

  <rect x="880" y="420" width="280" height="120" rx="6" class="box"/>
  <text x="895" y="442" class="t">LLM 客户端 · llm.py</text>
  <text x="895" y="462" class="s">默认连 127.0.0.1:8038</text>
  <text x="895" y="478" class="s">用 JSON schema 限定可选的答案，</text>
  <text x="895" y="494" class="s">服务端不支持就退回 json_object</text>
  <text x="895" y="510" class="s">发送前先用 /tokenize 数 token</text>
  <text x="895" y="526" class="s">超时和 HTTP 错误分开记</text>

  <rect x="880" y="565" width="280" height="80" rx="6" class="box" style="fill:#fff8e8"/>
  <text x="895" y="587" class="t">dashboard · 端口 8095</text>
  <text x="895" y="607" class="s">实时跟随 events.jsonl，也能回放</text>
  <text x="895" y="623" class="s">v6 分数面板和分支时间轴</text>

  <rect x="880" y="670" width="280" height="140" rx="6" class="box"/>
  <text x="895" y="692" class="t">记录与导出 · twin_record.py</text>
  <text x="895" y="712" class="s">episodes/&lt;job_id&gt;/ 下有 events.jsonl、</text>
  <text x="895" y="728" class="s">replay.mp4、FFV1、关键帧和检查点</text>
  <text x="895" y="748" class="s">决策事件带回退原因、token 数和延迟</text>
  <text x="895" y="768" class="s">export 导出到 LeRobot 0.6，</text>
  <text x="895" y="784" class="s">只收成功且没 rewind 过的 episode</text>

  <!-- ===== 连线（互不交叉） ===== -->
  <path d="M300,115 L328,115" class="e"/>
  <path d="M330,250 L230,288" class="e"/>
  <path d="M590,260 L590,288" class="e"/>
  <text x="598" y="282" class="s">start_episode · resume_job</text>
  <path d="M300,335 L328,335" class="e"/>
  <path d="M590,374 L590,392" class="e"/>
  <path d="M850,480 L878,480" class="d"/>
  <path d="M1020,420 L1020,237" class="d"/>
  <path d="M590,640 L590,668" class="e"/>
  <path d="M850,740 L878,740" class="e"/>
  <path d="M1020,670 L1020,647" class="e"/>
</svg>
