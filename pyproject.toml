[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-armigo"
version = "0.1.0"
description = "SO-101 sorting cell digital twin assets and Isaac Lab / MuJoCo / Blender pipelines."
requires-python = ">=3.12"
dependencies = [
	"numpy>=1.26",
]

[project.optional-dependencies]
catalog = ["fastapi>=0.115", "uvicorn>=0.30"]
# MuJoCo cell (simulate / render); marker textures need OpenCV.
mujoco = [
	"mujoco>=3.2",
	"opencv-python>=4.9",
]
# fit-camera / layout-prior against the real sort-depth-v2 recordings.
calibration = [
	"av>=12",
	"pyarrow>=15",
	"scipy>=1.11",
]
twin = ["mcp>=1.12,<2", "av>=12"]
# LangGraph inspection agent; the LLM client talks to an OpenAI-compatible server (local vLLM) over httpx.
agent = [
	"httpx>=0.28",
	"langgraph>=0.6",
	"langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
armigo-data = "digital_twin_armigo.catalog.cli:main"
armigo-mcp = "digital_twin_armigo.agent.twin_mcp:main"
armigo-sim = "digital_twin_armigo.mujoco_cell.cli:main"

[dependency-groups]
dev = [
	"httpx>=0.28",
	"pytest>=8.0",
	"ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin_armigo"]

[tool.hatch.build.targets.wheel.force-include]
"src/digital_twin_armigo/agent/twin_dashboard.html" = "digital_twin_armigo/agent/twin_dashboard.html"
"src/digital_twin_armigo/catalog/index.html" = "digital_twin_armigo/catalog/index.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Archived one-off diagnostics kept next to their results; not maintained code.
extend-exclude = ["results"]

[tool.ruff.format]
indent-style = "tab"
