[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-armigo"
version = "0.1.0"
description = "SO-101 sorting cell digital twin assets and Isaac Lab / MuJoCo / Blender pipelines."
requires-python = ">=3.12"
dependencies = [
	"numpy>=1.26",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
	"ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin_armigo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
indent-style = "tab"
