[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin-armigo"
version = "0.1.0"
description = "SO-101 sorting cell digital twin assets and Isaac Lab / MuJoCo / Blender pipelines."
requires-python = ">=3.12"
dependencies = [
	"numpy>=1.26",
]

[project.optional-dependencies]
# MuJoCo cell (simulate / render); marker textures need OpenCV.
mujoco = [
	"mujoco>=3.2",
	"opencv-python>=4.9",
]
# fit-camera / layout-prior against the real sort-depth-v2 recordings.
calibration = [
	"av>=12",
	"pyarrow>=15",
	"scipy>=1.11",
]

[project.scripts]
armigo-sim = "digital_twin_armigo.mujoco_cell.cli:main"

[dependency-groups]
dev = [
	"pytest>=8.0",
	"ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin_armigo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
indent-style = "tab"
