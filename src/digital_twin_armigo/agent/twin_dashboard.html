<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armigo · Episode 回放</title>
<style>
:root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #10171c; color: #e3ecee; }
body { margin: auto; padding: 24px; max-width: 1600px; }
header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; align-items: center; }
h1 { font-size: 24px; margin: .2em 0; } h2 { font-size: 16px; font-weight: 550; margin: 0; }
label { display: inline-flex; align-items: center; gap: 8px; }
select, button { font: inherit; color: inherit; background: #1e2d35; border: 1px solid #3a535e; border-radius: 6px; padding: 8px; }
main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 18px; margin-top: 16px; }
article, aside { min-width: 0; } section { background: #172229; padding: 14px; margin-bottom: 16px; border-radius: 9px; }
#controls { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-block: 4px 12px; }
video, img { width: 100%; display: block; background: #11191e; border-radius: 5px; }
[hidden] { display: none !important; }
canvas { display: block; width: 100%; height: auto; margin: 10px 0 0; }
#timeline { max-height: 390px; overflow: auto; margin-top: 8px; }
#timeline button { display: block; width: 100%; border-radius: 0; border: 0; border-bottom: 1px solid #293a42;
  text-align: left; cursor: pointer; padding: 8px 3px; background: transparent; font-size: 13px; }
#timeline button:hover, #timeline button:focus-visible { background: #243843; }
#timeline button[data-kind="failure"] { color: #ffc3b2; }
#timeline button[data-kind="rewound"] { color: #8deaaf; }
#caption, #status, #branch-info, #downloads, #evidence-view { color: #a5bbc4; font-size: 13px; }
#downloads a, #evidence-view a { color: #8de0b8; margin-right: 12px; }
#episode-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
#detector-header { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
#detector-mode, #detector-meta, #detector-note, #detector-legend { font-size: 13px; color: #a5bbc4; }
#detector-verdict { margin: 12px 0 6px; color: #c0d1d7; }
#detector-panel[data-state="alarm"] #detector-verdict { color: #ffc49b; }
#detector-panel[data-state="below"] #detector-verdict { color: #91e6b8; }
#detector-panel[data-state="error"] #detector-verdict { color: #ffad9d; }
#detector-meta, #detector-note { margin: 6px 0 0; }
#detector-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin: 12px 0; }
#detector-metrics div { background: #202f37; padding: 8px; border-radius: 5px; }
#detector-metrics dt { color: #adc3cd; font-size: 12px; }
#detector-metrics dd { margin: 3px 0 0; font: 16px ui-monospace, monospace; }
#detector-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
.dot::before, .dash::before { content: ""; display: inline-block; margin-right: 5px; vertical-align: middle; }
.dot::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dash::before { width: 14px; border-top: 2px dashed currentColor; }
.dot.below { color: #91e6b8; } .dot.alarm { color: #ffc49b; }
#evidence-images { display: grid; grid-template-columns: 2fr 1fr; gap: 7px; margin-top: 8px; }
@media(max-width:900px) {
  body { padding: 12px; }
  main { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  article, aside { display: contents; }
  section { margin-bottom: 0; }
  #motion { order: 1; }
  #detector-panel { order: 2; }
  #evidence-view { order: 3; }
  #graph-section { order: 4; }
  #timeline-section { order: 5; }
}
</style>
</head>
<body>
<header>
  <h1>Armigo 数字孪生</h1>
  <div id="episode-controls">
    <label>Episode <select id="episodes" aria-label="Episode"></select></label>
    <label><input id="follow-episode" type="checkbox"> 跟随最新 Episode</label>
  </div>
</header>
<main>
<article>
  <section id="motion">
    <div id="controls">
      <label>分支 <select id="branches" aria-label="分支"></select></label>
      <button type="button" id="follow-branch" hidden>回到实时分支</button>
      <span id="status" role="status">等待 episode</span>
    </div>
    <video id="replay" controls preload="metadata" playsinline hidden></video>
    <img id="live" alt="机械臂、腕部相机和外置相机实时画面" hidden>
    <p id="branch-info"></p>
    <div id="downloads"></div>
  </section>
  <section id="evidence-view" hidden>
    <h2>判读相机帧</h2><p id="caption"></p>
    <div id="evidence-images"><img id="raw" alt="原始相机帧"><img id="crop" alt="检测器实际输入裁图"></div>
  </section>
</article>
<aside>
  <section id="detector-panel" aria-labelledby="detector-title">
    <div id="detector-header"><h2 id="detector-title">v6 判别器</h2><span id="detector-mode"></span></div>
    <p id="detector-verdict" role="status">等待判读</p>
    <p id="detector-meta" hidden></p>
    <dl id="detector-metrics" hidden>
      <div><dt>融合分数 u</dt><dd id="detector-score">—</dd></div>
      <div><dt>当前阈值</dt><dd id="detector-threshold">—</dd></div>
      <div><dt>分数减阈值</dt><dd id="detector-margin">—</dd></div>
      <div><dt>分类头 u</dt><dd id="detector-cls">—</dd></div>
      <div><dt>分割头 u</dt><dd id="detector-seg">—</dd></div>
    </dl>
    <p id="detector-note" hidden></p>
    <canvas id="detector-chart" width="520" height="155" aria-label="该分支的判别器历史分数" role="img" hidden></canvas>
    <div id="detector-legend" hidden><span class="dot below">低于阈值</span><span class="dot alarm">报警</span><span class="dash">阈值</span></div>
  </section>
  <section id="graph-section"><h2>LangGraph 状态机</h2><canvas id="graph" width="520" height="210" aria-label="LangGraph 节点和路径"></canvas></section>
  <section id="timeline-section"><h2>事件序列</h2><div id="timeline" aria-label="事件序列"></div></section>
</aside>
</main>
<script>
const el = id => document.getElementById(id);
const episode = el('episodes'), branch = el('branches'), replay = el('replay'), live = el('live');
let current = '', data, updateInProgress = false, lastReplay = '', lastEvents = '';
let reviewedEvent = null, followingBranch = true, lastDetector = '';
const detectorKinds = new Set(['view', 'detector_started', 'detector_error', 'view_unavailable']);
const faceNames = ['+X', '−X', '+Y', '−Y', '顶面', '底面'];
const cameraNames = {wrist_cam:'腕部相机', top:'外置相机'};
const detectorReasons = {
  NO_CROP:'没有可用裁图', TOO_FEW_BRICK_PIXELS:'积木像素不足', NO_READABLE_FACE:'可见面面积不足',
  NONFINITE_SCORE:'模型返回无效分数', DETECTOR_UNAVAILABLE:'评分服务出错', NO_BOTTOM_PATH:'没有可用的底面展示姿态'
};
const captions = {
  prepare:'准备', choose_view:'选择视角', scan_wrist:'腕部扫描', present_bottom:'展示底面',
  recover:'失败恢复', place:'放置', evaluate:'验收'
};
const colors = { canvas:'#172229', node:'#243945', edge:'#607c88', green:'#54c68a', text:'#e2edef' };
const positions = { prepare:[63,45], choose_view:[198,45], scan_wrist:[340,32], present_bottom:[340,104],
  recover:[199,169], place:[462,47], evaluate:[462,168] };

function draw(active) {
  if (!data) return;
  const canvas = el('graph'), ctx = canvas.getContext('2d');
  ctx.fillStyle = colors.canvas; ctx.fillRect(0,0,520,210);
  for (const [from,to] of data.graph.edges) {
    const [x,y] = positions[from], [tx,ty] = positions[to];
    const angle = Math.atan2(ty-y,tx-x);
    const ux = Math.cos(angle), uy = Math.sin(angle);
    const end = 49 * Math.abs(ux) + 19 * Math.abs(uy);
    const sx = x+ux*end, sy = y+uy*end, ex = tx-ux*end, ey = ty-uy*end;
    ctx.strokeStyle = to === active ? colors.green : colors.edge;
    ctx.lineWidth = to === active ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);
    ctx.lineTo(ex-7*ux+3*uy,ey-7*uy-3*ux);
    ctx.moveTo(ex,ey); ctx.lineTo(ex-7*ux-3*uy,ey-7*uy+3*ux); ctx.stroke();
  }
  ctx.font = '14px system-ui';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const node of data.graph.nodes) {
    const [x,y] = positions[node];
    ctx.fillStyle = node === active ? colors.green : colors.node; ctx.fillRect(x-48,y-18,96,36);
    ctx.fillStyle = node === active ? '#102219' : colors.text; ctx.fillText(captions[node], x, y);
  }
}

function media(name) { return '/media/' + encodeURIComponent(current) + '/' + name; }
function activeEvents() { return (data?.events ?? []).filter(event => String(event.branch) === branch.value); }
function selectedBranch() { return data?.episode?.branches.find(item => String(item.id) === branch.value); }
function fillOptions(select, choices, fallback) {
  if (JSON.stringify(choices) === select.dataset.values) return;
  const old = select.value;
  select.replaceChildren(...choices.map(([value, label]) => new Option(label, value)));
  select.value = choices.some(x => x[0] === old) ? old : fallback;
  select.dataset.values = JSON.stringify(choices);
}

function drawDetectorChart(events) {
  const points = events.filter(ev => Number.isFinite(ev.observation?.score) && Number.isFinite(ev.observation?.threshold));
  const canvas = el('detector-chart');
  canvas.hidden = el('detector-legend').hidden = points.length === 0;
  if (!points.length) return;
  const ctx = canvas.getContext('2d'), left = 58, right = 502, top = 11, bottom = 125;
  const values = points.flatMap(({observation:o}) => [o.score, o.threshold]);
  const min = Math.min(...values), max = Math.max(...values);
  const padding = Math.max((max-min)*0.12, 0.03), yMin = min-padding, yMax = max+padding;
  const first = selectedBranch()?.start_frame ?? (activeEvents()[0]?.frame ?? 0);
  const last = Math.max(first+1, points.at(-1).frame);
  const x = frame => left + (frame-first)/(last-first)*(right-left);
  const y = score => bottom - (score-yMin)/(yMax-yMin)*(bottom-top);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font = '13px ui-monospace, monospace'; ctx.fillStyle = colors.text;
  for (let i=0; i<=2; i++) {
    const v = yMin+i*(yMax-yMin)/2, yy = y(v);
    ctx.textAlign = 'right'; ctx.fillText(v.toFixed(2), left-8, yy+4);
    ctx.strokeStyle = '#324851'; ctx.beginPath(); ctx.moveTo(left,yy); ctx.lineTo(right,yy); ctx.stroke();
  }
  ctx.strokeStyle = '#a5bbc4'; ctx.setLineDash([5,4]);
  for (let i=0; i<points.length; i++) {
    const point = points[i], value = point.observation.threshold;
    ctx.beginPath();
    ctx.moveTo(i === 0 ? left : x(point.frame), y(value));
    ctx.lineTo(i === points.length-1 ? right : x(points[i+1].frame), y(value)); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const point of points) {
    const o = point.observation;
    ctx.fillStyle = o.score >= o.threshold ? '#ffc49b' : '#91e6b8';
    ctx.beginPath(); ctx.arc(x(point.frame), y(o.score), 4.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = colors.text; ctx.textAlign = 'left'; ctx.fillText('帧 ' + first, left, 148);
  ctx.textAlign = 'right'; ctx.fillText(String(last), right, 148);
}

function showDetector(events, mode) {
  const readings = events.filter(ev => detectorKinds.has(ev.kind));
  const latest = readings.at(-1);
  const signature = JSON.stringify([current, branch.value, mode, latest?.seq]);
  if (lastDetector === signature) return;
  lastDetector = signature;
  const observation = latest?.observation, details = latest?.detector;
  const score = observation?.score, threshold = observation?.threshold;
  const scored = Number.isFinite(score) && Number.isFinite(threshold);
  const state = scored ? (score >= threshold ? 'alarm' : 'below') :
    latest?.kind === 'detector_started' ? 'pending' : latest?.kind === 'detector_error' ? 'error' : 'unknown';
  const format = value => Number.isFinite(value) ? value.toFixed(3) : '—';
  el('detector-panel').dataset.state = state;
  el('detector-mode').textContent = mode;
  el('detector-verdict').textContent = {
    alarm:'本视图报警', below:'本视图低于阈值', pending:'正在判读', error:'判读出错',
    unknown:latest ? '本视图不可判读' : '等待判读'
  }[state];
  el('detector-meta').hidden = !latest;
  if (latest) {
    const camera = observation?.camera ?? latest.camera;
    const faces = observation?.faces?.map(face => faceNames[face]).join('、');
    el('detector-meta').textContent = [cameraNames[camera] ?? camera, '分支 ' + latest.branch, '帧 ' + latest.frame,
      faces && '可见面 ' + faces, Number.isFinite(details?.elapsed_ms) && details.elapsed_ms.toFixed(0) + ' ms'].filter(Boolean).join(' · ');
  }
  el('detector-metrics').hidden = !observation;
  el('detector-score').textContent = format(score);
  el('detector-threshold').textContent = format(threshold);
  el('detector-margin').textContent = format(scored ? score-threshold : null);
  el('detector-cls').textContent = format(details?.head_scores?.cls);
  el('detector-seg').textContent = format(details?.head_scores?.seg);
  const reason = details?.reason ?? latest?.reason;
  const note = detectorReasons[reason] ?? (scored && !details?.head_scores ? '旧记录仅含融合分数' : '');
  el('detector-note').hidden = !note; el('detector-note').textContent = note;
  drawDetectorChart(readings);
  el('evidence-view').hidden = !observation;
  if (!observation) return;
  const stem = media('keyframes/' + observation.id.replaceAll(':','-'));
  el('raw').src = stem + '-frame.png';
  el('crop').hidden = !observation.crop_bbox;
  if (observation.crop_bbox) el('crop').src = stem + '-crop.png';
  else el('crop').removeAttribute('src');
  el('caption').textContent = (cameraNames[observation.camera] ?? observation.camera) + ' · 分支 ' +
    observation.branch + ' · 第 ' + observation.frame + ' 帧';
}

function eventTime(event, selected = selectedBranch()) {
  return Math.min(Math.max(0,(event.frame-selected.start_frame)/data.episode.fps), replay.duration || Infinity);
}

function showAtCursor() {
  const events = activeEvents(), selected = selectedBranch();
  let available = events;
  if (reviewedEvent) available = events.filter(ev => ev.seq <= reviewedEvent.seq);
  else if (!replay.hidden && selected) {
    const frame = Math.floor(replay.currentTime*data.episode.fps+1e-5)+selected.start_frame;
    available = events.filter(ev => ev.frame <= frame);
  }
  const node = replay.hidden ? available.at(-1) : available.filter(ev => ev.kind === 'node').at(-1);
  draw(reviewedEvent?.node ?? node?.node);
  showDetector(available, reviewedEvent ? '选中事件' : data.episode ? '回放' : '实时');
}

function timeline() {
  const events = activeEvents();
  const signature = JSON.stringify([current,branch.value,events.length]);
  if (signature === lastEvents) return;
  lastEvents = signature;
  el('timeline').replaceChildren(...events.map(ev => {
    const button = document.createElement('button');
    button.type = 'button'; button.dataset.kind = ev.kind;
    const detail = ev.code || ev.choice || ev.checkpoint || ev.observation?.camera || ev.reason || '';
    button.textContent = '#' + ev.seq + ' · ' + (ev.frame / 30).toFixed(2) + 's · ' + captions[ev.node] +
      ' · ' + ev.kind + (detail ? ' · ' + detail : '');
    button.onclick = () => {
      reviewedEvent = ev;
      if (!data.episode) followingBranch = false;
      if (!replay.hidden && selectedBranch()) {
        replay.pause();
        replay.currentTime = eventTime(ev);
      }
      el('follow-branch').hidden = Boolean(data.episode);
      showAtCursor();
    };
    return button;
  }));
}

function show(branchChanged = false, justFinished = false) {
  const finished = data.episode;
  const b = selectedBranch();
  el('status').textContent = finished
    ? finished.result.verdict + ' · ' + finished.result.label + ' · ' + finished.result.views + ' 视图'
    : '实时运行';
  el('branch-info').textContent = b
    ? '分支 ' + b.id + ' · 起始帧 ' + b.start_frame + (b.parent_branch === undefined ? '' : ' · 回溯自分支 ' + b.parent_branch)
    : '';
  if (finished?.video && b?.actions) {
    replay.hidden = false; live.hidden = true;
    const url = media('branch-' + b.id + '/replay.mp4');
    if (lastReplay !== url) { replay.src = url; lastReplay = url; }
  } else {
    replay.hidden = true;
    if (lastReplay) { replay.pause(); replay.removeAttribute('src'); replay.load(); lastReplay = ''; }
    live.hidden = !data.thumbnail || (!finished && String(data.events.at(-1)?.branch) !== branch.value);
    if (!live.hidden) live.src = media('live.jpg') + '?' + Date.now();
  }
  el('downloads').replaceChildren(...(finished?.video && b?.actions
    ? ['front','wrist','top_rgb','top_depth'].map(name => {
      const a = document.createElement('a');
      a.href = media('branch-' + b.id + '/' + name + '.mkv');
      a.download = ''; a.textContent = name; return a;
    }) : []));
  if (branchChanged) reviewedEvent = null;
  if (justFinished && b && !replay.hidden) {
    reviewedEvent ??= activeEvents().findLast(ev => detectorKinds.has(ev.kind));
    if (reviewedEvent) replay.currentTime = eventTime(reviewedEvent, b);
  }
  el('follow-branch').hidden = Boolean(finished) || followingBranch;
  timeline();
  showAtCursor();
}

replay.ontimeupdate = () => {
  if (reviewedEvent && selectedBranch() && Math.abs(replay.currentTime-eventTime(reviewedEvent)) > .5/data.episode.fps) {
    reviewedEvent = null;
  }
  showAtCursor();
};
replay.onloadedmetadata = replay.ontimeupdate;
replay.onplay = () => { reviewedEvent = null; showAtCursor(); };
branch.onchange = () => { followingBranch = false; show(true); };
episode.onchange = () => {
  el('follow-episode').checked = false;
  refresh();
};
el('follow-episode').onchange = refresh;
el('follow-branch').onclick = () => { followingBranch = true; reviewedEvent = null; refresh(); };

async function refresh() {
  if (updateInProgress) return;
  updateInProgress = true;
  try {
    const ids = await (await fetch('/api/episodes', {cache:'no-store'})).json();
    fillOptions(episode, ids.map(id => [id, id]), ids[0] ?? '');
    if (el('follow-episode').checked && ids.length) episode.value = ids[0];
    if (!episode.value) return;
    const chosen = episode.value;
    const changed = current !== chosen;
    if (changed) { current = chosen; followingBranch = true; branch.replaceChildren(); branch.dataset.values = ''; }
    const response = await fetch('/api/episode/' + encodeURIComponent(chosen), {cache:'no-store'});
    if (!response.ok) throw Error('无法读取 episode');
    const snapshot = await response.json();
    const justFinished = !changed && data && !data.episode && Boolean(snapshot.episode);
    data = snapshot;
    const branches = data.episode?.branches.map(x => x.id)
        ?? [...new Set(data.events.map(x => x.branch))];
    const latest = data.episode?.result.active_branch ?? branches.at(-1) ?? 0;
    const old = branch.value;
    fillOptions(branch, branches.map(i => [String(i),'分支 '+i]), String(latest));
    if (followingBranch && branches.includes(latest)) branch.value = String(latest);
    show(changed || old !== branch.value, justFinished);
  } catch (err) {
    el('status').textContent = err.message;
  } finally { updateInProgress = false; }
}
refresh(); setInterval(refresh, 900);
</script>
</body>
</html>
