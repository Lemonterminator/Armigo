<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地实验看板</title>
<style>
:root{color-scheme:light;--ink:#19332d;--muted:#62746e;--line:#dce6df;--green:#146b50}*{box-sizing:border-box}body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#f3f6f2;margin:0 auto;max-width:1700px;padding:28px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:18px}header{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}h2{font-size:17px;margin:0 0 16px}h3{overflow-wrap:anywhere;font-size:17px}header:before{content:"ARMIGO / EXPERIMENT LIBRARY";font-size:11px;letter-spacing:2px;color:var(--green);display:block;margin-bottom:12px}section{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}section[aria-label="导入"]{grid-column:1/-1;padding:14px 20px}section[aria-label="导入"] h2{display:inline-block;margin:0 20px 0 0}section[aria-label="导入"] form{display:inline-flex;width:80%;align-items:center}section[aria-label="导入"] label{flex:1}section[aria-label="导入"] input{width:85%}section[aria-label="筛选"]{grid-column:1;grid-row:3/5;max-height:880px;overflow:auto}section[aria-label="详情"]{grid-column:2;grid-row:3;max-height:650px;overflow:auto}section[aria-label="导出"]{grid-column:2;grid-row:4}section[aria-label="任务"]{grid-column:1/-1}form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{font-size:12px;color:var(--muted);display:inline-flex;flex-direction:column;gap:5px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:white;color:var(--ink)}input[type=checkbox]{accent-color:var(--green)}button{cursor:pointer;background:#eaf2ec;font-size:12px}button:hover{background:#d5e8dc}button[type=submit],#fEx button{background:var(--green);color:white}table{width:100%;border-collapse:collapse}th{font-size:10px;text-align:left;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;border-bottom:1px solid var(--line);padding:12px 8px}td{padding:12px 8px;border-bottom:1px solid #edf1ec;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis}td:nth-child(2){max-width:65px;font-family:monospace}tr:hover{background:#f7faf5}.ok{color:#176548;background:#e5f3e9}.bad{color:#a73b38;background:#fae9e6}.warn{color:#8a6019;background:#fbf1db}.mut{color:#6a7771;background:#edf1ed}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.7;background:#f5f7f4;border-radius:8px;padding:12px;max-height:240px;overflow:auto}.err{color:#b3261e;white-space:pre-wrap;font-size:13px}#sum{color:var(--muted);font-size:13px}#fSp{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}#jobs{padding:0;list-style:none}#jobs li{padding:10px;border-bottom:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}a{color:var(--green);margin-left:12px}video{border-radius:8px;margin-top:14px}#det p{font-size:12px;line-height:1.7;overflow-wrap:anywhere}@media(max-width:950px){body{display:block;padding:16px}header,section{margin-bottom:16px}section[aria-label="筛选"]{max-height:600px}section[aria-label="导入"] form{width:100%}}
</style></head>
<body><header><h1>本地实验看板</h1><p id="sum">加载中</p><p class="err" id="err" role="alert"></p></header>
<section aria-label="导入"><h2>导入</h2><form id="fImp"><label>Path <input name="path" required></label><button>导入</button></form></section>
<section aria-label="筛选"><h2>实验记录</h2><form id="fQ"><label>搜索<input id="qS" type="search" placeholder="条件、种子或实验名称"></label><label>实验判定<select id="qV"><option value="">全部</option><option>SUCCESS</option><option>FAILURE</option><option>UNKNOWN</option><option>INFEASIBLE</option></select></label><label>引擎<select id="qE"><option value="">全部</option><option value="mujoco">MuJoCo</option><option value="isaac">Isaac</option></select></label><label>质量<select id="qQuality"><option value="">全部</option><option>PASS</option><option>FAIL</option><option>UNKNOWN</option></select></label><button>查询</button></form><p>已选 <b id="cnt">0</b> 项 · <span id="total">0</span> 条记录 · 默认不导出</p><table><thead><tr><th>选</th><th>ID</th><th>实验名称</th><th>引擎</th><th>判定</th><th>质量</th><th></th></tr></thead><tbody id="rows"></tbody></table><button id="prev" type="button">上一页</button><button id="next" type="button">下一页</button></section>
<section aria-label="详情"><h2>详情</h2><div id="det">未选择</div><video id="vid" controls hidden style="max-width:100%"></video><pre id="js"></pre><table hidden id="qt"><thead><tr><th>质量项</th><th>状态</th></tr></thead><tbody id="qb"></tbody></table></section>
<section aria-label="导出"><h2>导出已选</h2><form id="fEx"><label>format<select name="format"><option value="archive">archive</option><option value="existing-video">existing-video</option><option value="mujoco-video">mujoco-video</option><option value="isaac-rtx">isaac-rtx</option><option value="lerobot">lerobot</option></select></label><label>profile<select name="profile"><option value="preview">preview</option><option value="quality">quality</option></select></label><label><input type="checkbox" name="allow_incomplete">允许不完整</label><button>提交导出</button></form><form id="fSp"><label>切分名<input name="name" required></label><input name="seed" type="number" value="0" aria-label="seed"><button>创建切分</button></form></section>
<section aria-label="任务"><h2>Jobs(3s刷新)</h2><ul id="jobs"></ul></section>
<script>
let offset=0;let T='',sel=new Set();const $=i=>document.getElementById(i);
function e(t,n){const x=document.createElement(t);x.textContent=n??'';return x}
function fail(m){$('err').textContent=m||''}
function lab(v,q){return v==='SUCCESS'?'ok':v==='FAILURE'?'bad':v==='INFEASIBLE'?'warn':v==='UNKNOWN'?'mut':q==='FAIL'?'bad':q==='PASS'?'ok':'mut'}
async function api(p,o={}){o.headers=Object.assign({},o.headers||{});if((o.method||'GET')!=='GET')o.headers['X-Catalog-Token']=T;const r=await fetch(p,o);if(!r.ok){const err=await r.json().catch(()=>({detail:r.status}));throw new Error(err.detail||r.status)}return r.json()}
async function init(){try{T=(await (await fetch('/api/token')).json()).token||'';const s=await api('/api/summary');$('sum').textContent=s.episodes+' 条来源记录 · '+s.artifacts+' 个索引文件 · 原文件保持原位 · 默认不导出'}catch(m){fail(String(m))}load();jobs();setInterval(jobs,3000)}
async function load(){try{fail('');const q='/api/episodes?search='+encodeURIComponent($('qS').value)+'&verdict='+encodeURIComponent($('qV').value)+'&engine='+encodeURIComponent($('qE').value)+'&quality='+encodeURIComponent(document.getElementById("qQuality").value)+'&limit=50&offset='+offset+'';const d=await api(q);const b=$('rows');b.textContent='';(d.items||[]).forEach(it=>{const tr=e('tr');const c=e('td');const k=e('input');k.type='checkbox';k.setAttribute('aria-label','选择'+it.id);k.checked=sel.has(it.id);k.onchange=()=>{k.checked?sel.add(it.id):sel.delete(it.id);$('cnt').textContent=sel.size};c.append(k);tr.append(c);[it.id,it.alias,it.engine].forEach(v=>tr.append(e('td',v)));const v=e('td',it.verdict);v.className=lab(it.verdict,'');tr.append(v);const qq=e('td',it.quality_status);qq.className=lab('',it.quality_status);tr.append(qq);const a=e('td');const bt=e('button','详情');bt.onclick=()=>detail(it.id);a.append(bt);tr.append(a);b.append(tr)});$('cnt').textContent=sel.size}catch(m){fail(String(m))}}
async function detail(id){try{fail('');const d=await api('/api/episodes/'+encodeURIComponent(id));const w=$('det');w.textContent='';const h=e('h3',d.alias||id);w.append(h);const p=e('p','verdict:'+d.verdict+' / engine:'+d.engine);p.className=lab(d.verdict,'');w.append(p);const c=e('p','capabilities:'+Object.entries(d.capabilities||{}).filter(([k,v])=>v).map(([k])=>k).join(', '));w.append(c);const pr=e('p','provenance:'+JSON.stringify(d.provenance||{}));w.append(pr);$('js').textContent=JSON.stringify(d,null,2);const qb=$('qb');qb.textContent='';(d.quality||[]).forEach(q=>{const tr=e('tr');tr.append(e('td',q.name||JSON.stringify(q)));const s=e('td',q.status||'');s.className=lab('',q.status);tr.append(s);qb.append(tr)});$('qt').hidden=!(d.quality||[]).length;const v=(d.artifacts||[]).find(a=>a.role==='video')||{};const vid=$('vid');if(v.url){vid.src=v.url;vid.hidden=false}else{vid.hidden=true;vid.removeAttribute('src')}}catch(m){fail(String(m))}}
async function jobs(){try{const d=await api('/api/jobs');const u=$('jobs');u.textContent='';(d.items||[]).forEach(j=>{const li=e('li');li.textContent=j.id+' '+j.state+' '+j.format+' '+(j.progress??'')+' '+(j.error||'');if(j.download_url){const a=e('a','下载');a.href=j.download_url;li.append(a)}u.append(li)})}catch(m){fail(String(m))}}
$('fQ').onsubmit=x=>{x.preventDefault();offset=0;load()};$('prev').onclick=()=>{offset=Math.max(0,offset-50);load()};$('next').onclick=()=>{offset+=50;load()};
$('fImp').onsubmit=async x=>{x.preventDefault();try{fail('');await api('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:new FormData(x.target).get('path')})});load()}catch(m){fail(String(m))}};
$('fEx').onsubmit=async x=>{x.preventDefault();try{fail('');if(!sel.size)throw new Error('请先勾选');const f=new FormData(x.target);await api('/api/exports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode_ids:[...sel],format:f.get('format'),profile:f.get('profile'),request_id:crypto.randomUUID(),allow_incomplete:!!f.get('allow_incomplete')})});jobs()}catch(m){fail(String(m))}};
$('fSp').onsubmit=async x=>{x.preventDefault();try{fail('');if(!sel.size)throw new Error('请先勾选');const f=new FormData(x.target);await api('/api/splits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode_ids:[...sel],name:f.get('name'),seed:Number(f.get('seed')||0)})})}catch(m){fail(String(m))}};
const rerunOption=e('option','单独重跑（生成新实验）');rerunOption.value='rerun';document.querySelector('[name=format]').append(rerunOption);
const qualityForm=e('form');qualityForm.style.marginTop='16px';const qualityLabel=e('label','夹持力峰值上限 (N，可选)');const qualityInput=e('input');qualityInput.type='number';qualityInput.min=0;qualityInput.step='any';qualityLabel.append(qualityInput);const qualityButton=e('button','对所选实验重新评估');qualityForm.append(qualityLabel,qualityButton);document.querySelector('[aria-label=导出]').append(qualityForm);
qualityForm.onsubmit=async ev=>{ev.preventDefault();try{if(!sel.size)throw Error('请先选择实验');await api('/api/quality',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode_ids:[...sel],rules:qualityInput.value===''?{}:{pinch_force_N:Number(qualityInput.value)}})});load()}catch(err){fail(String(err))}};
const originalLoad=load;load=async()=>{await originalLoad();const p=await api('/api/episodes?limit=1&search='+encodeURIComponent($('qS').value)+'&verdict='+encodeURIComponent($('qV').value)+'&engine='+encodeURIComponent($('qE').value)+'&quality='+encodeURIComponent($('qQuality').value));$('total').textContent=p.total;$('prev').disabled=offset===0;$('next').disabled=offset+50>=p.total};
detail=async id=>{try{fail('');const d=await api('/api/episodes/'+encodeURIComponent(id));$('det').textContent='';$('det').append(e('h3',d.alias),e('p','原实验判定：'+d.verdict+' · 质量：'+d.quality_status),e('p','角色：'+d.role+' · 布局分组：'+(d.layout_group?'已验证':'未知')));const group=e('details');group.append(e('summary','来源、关联与原始记录'),e('pre',JSON.stringify({provenance:d.provenance,relations:d.relations,raw:d.raw},null,2)));$('js').textContent='';$('js').append(group);const qb=$('qb');qb.textContent='';for(const q of d.quality||[]){const tr=e('tr');tr.append(e('td',q.name+'：'+(q.value??'未知')+' '+q.unit+' / 上限 '+(q.limit??'未配置')));const td=e('td',q.status);td.className=lab('',q.status);tr.append(td);qb.append(tr)}$('qt').hidden=false;const v=d.artifacts.find(a=>a.role==='rtx_video')||d.artifacts.find(a=>a.role==='video');$('vid').hidden=!v;if(v)$('vid').src=v.url;else{$('vid').pause();$('vid').removeAttribute('src')}const old=$('telemetry');if(old)old.remove();const charts=e('div');charts.id='telemetry';$('det').append(charts);const t=await api('/api/episodes/'+encodeURIComponent(id)+'/telemetry');for(const [name,values] of Object.entries(t.series)){charts.append(e('p',name));const canvas=e('canvas');canvas.width=440;canvas.height=100;canvas.style.width='100%';charts.append(canvas);const ctx=canvas.getContext('2d');ctx.fillStyle='#f4f7f3';ctx.fillRect(0,0,440,100);const max=Math.max(.001,...values);ctx.strokeStyle='#24765b';ctx.beginPath();values.forEach((y,i)=>{const x=8+i/Math.max(1,values.length-1)*424;const yy=90-y/max*75;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke();ctx.fillStyle='#62746e';ctx.fillText('峰值 '+max.toFixed(3),8,12)}}catch(err){fail(String(err))}};
jobs=async()=>{try{const d=await api('/api/jobs');$('jobs').textContent='';for(const j of d.items){const li=e('li',j.id.slice(0,12)+' · '+j.state+' · '+j.format+' · '+(j.progress||'')+' '+(j.error||''));if(j.download_url){const a=e('a','下载文件包');a.href=j.download_url;li.append(a)}if(['QUEUED','RUNNING','CANCEL_REQUESTED'].includes(j.state)){const b=e('button','取消');b.onclick=async()=>{await api('/api/jobs/'+j.id+'/cancel',{method:'POST'});jobs()};li.append(b)}if(['FAILED','CANCELLED'].includes(j.state)){const b=e('button','新建重试');b.onclick=async()=>{await api('/api/jobs/'+j.id+'/retry',{method:'POST'});jobs()};li.append(b)}$('jobs').append(li)}}catch(err){fail(String(err))}};
const validateButton=e('button','检查所选动画记录');validateButton.type='button';validateButton.onclick=async()=>{try{if(!sel.size)throw Error('请先选择实验');const r=await api('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode_ids:[...sel]})});fail(r.ok?'动画记录检查通过':JSON.stringify(r.validations));load()}catch(err){fail(String(err))}};qualityForm.append(validateButton);
const submitExport=$('fEx').onsubmit;$('fEx').onsubmit=async ev=>{ev.preventDefault();const button=$('fEx').querySelector('button');if(button.disabled)return;button.disabled=true;try{await submitExport(ev)}finally{button.disabled=false}};
const exportNames={archive:'数据与谱系文件包','existing-video':'已有视频','mujoco-video':'MuJoCo 回放动画','isaac-rtx':'RTX 逼真动画',lerobot:'LeRobot 数据集',rerun:'单独重跑（生成新实验）',preview:'预览 720p',quality:'质量 1080p'};
for(const select of [document.querySelector('[name=format]'),document.querySelector('[name=profile]')])for(const option of select.options){const v=option.value;option.textContent=exportNames[v]||option.textContent;option.value=v}
document.querySelector('[name=format]').parentElement.firstChild.textContent='导出内容';document.querySelector('[name=profile]').parentElement.firstChild.textContent='动画画质';document.querySelector('#fImp label').firstChild.textContent='项目内文件或文件夹 ';document.querySelector('[aria-label=任务] h2').textContent='任务状态 · 每 3 秒刷新';
const beforeCaptureDetail=detail;detail=async id=>{await beforeCaptureDetail(id);const d=await api('/api/episodes/'+encodeURIComponent(id));const p=e('p','动画记录检查：'+(d.capture_validation?.status||'未检查')+(d.capture_warning?' · '+d.capture_warning:''));p.className=lab('',d.capture_validation?.status);$('det').prepend(p)};
init();
</script></body></html>
